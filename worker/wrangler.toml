# worker/wrangler.toml - the Worker's own config. No secrets live here:
# completion codes (the one feature that would need one) are deferred. See
# docs/PRD.md milestone 3's note, BUILD_LOG.md session 2.27.
#
# RATE-LIMIT SYNTAX IS A FIRST DRAFT. The [[ratelimits]] block below is
# written from Cloudflare's current docs, but this is the first time this
# project has used the binding - confirm it with `wrangler dev` before
# trusting it, and fix the syntax here if wrangler's own error says otherwise.

name = "one-trade-worker"
main = "src/index.js"
compatibility_date = "2026-11-27"

[vars]
# Plain, public, not a secret: the one site allowed to call /ping and /guess.
ALLOWED_ORIGIN = "https://mayaagge.github.io"

# Anonymous counts: the level reached and a source code. docs/PRD.md: "A
# count ping carries the level reached and a source code from the link."
[[analytics_engine_datasets]]
binding = "PINGS"
dataset = "one_trade_pings"

# PREREG.md's five-field guess record. Hypothesis 3 reads this dataset only.
[[analytics_engine_datasets]]
binding = "GUESSES"
dataset = "one_trade_guesses"

# ?src=playtest rows land here instead - PREREG_AMENDMENT_3.md section 3.
# Never read by Hypothesis 3's analysis.
[[analytics_engine_datasets]]
binding = "GUESSES_PLAYTEST"
dataset = "one_trade_guesses_playtest"

# Per-participant-id limit on /guess, kept tight. An id alone is
# client-chosen and can be minted fresh on every request, so this one only
# catches a flood that reuses a single id from many different IPs -
# GUESS_IP_LIMITER below closes the opposite gap.
[[ratelimits]]
name = "GUESS_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Per-IP limit on /ping, the one route with no better key. NOT shared with
# /guess (see GUESS_IP_LIMITER below) - a class of 30-40 students on one
# campus-wifi IP would exhaust a shared budget on pings alone, before a
# single /guess got through. Raised to the same 300/60s as GUESS_IP_LIMITER
# on 27 November 2026 (BUILD_LOG.md): 30/60s was itself tight enough for one
# class session's worth of level-reached pings to undercount. The IP itself
# is only ever passed to this binding's own ephemeral counter - see
# worker/src/index.js.
[[ratelimits]]
name = "PING_LIMITER"
namespace_id = "1002"
simple = { limit = 300, period = 60 }

# /guess's OWN per-IP limit - generous enough that a full class sharing one
# IP never trips it just by playing normally, while GUESS_LIMITER above
# still catches a single id's flood. This is what closes the
# fresh-random-id-per-request dodge now, not PING_LIMITER.
[[ratelimits]]
name = "GUESS_IP_LIMITER"
namespace_id = "1003"
simple = { limit = 300, period = 60 }
